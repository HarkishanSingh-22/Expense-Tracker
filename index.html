<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <!-- Bootstrap Integrate -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="main pt-5 pb-3 px-5">
        <h1 class="text-white">Hey! Harkishan</h1>
        <h4 class="text-white">Add Your Expense Today</h4>
    </div>
    <div class="expense-tracker-container px-5  pb-5 px-4">
        <div
            class="total-expense  pb-4 border mb-4 px-2 py-4 rounded d-flex justify-content-between align-items-center">
            <h3>Total Expense</h3>
            <p class="mb-0 fs-4">₹<span id="totalExpense">0</span></p>
        </div>
        <div class="d-flex gap-3 w-100">
            <div class="w-50">
                <input type="text" id="expense-remark" class="form-control py-2" placeholder="Enter Expense Remark">
                <p class="text-danger mb-0 px-2 py-1" id="remark-error">Please enter remark</p>
            </div>

            <div class="w-50">
                <input type="number" id="expense-amt" class="form-control py-2" placeholder="Enter Expense Amount">
                <p class="text-danger mb-0 px-2 py-1" id="amount-error">Please enter amount</p>
            </div>
            <button onclick="addExpense()" class="btn btn-primary h-100 w-25 px-3 py-2">Add Expense</button>

        </div>
    </div>
    <!-- Expense-items-container  -->

    <div class="expense-div px-5 pb-5">

        <!-- Header -->
        <div class="expense-header d-flex align-items-center border py-3 px-3">
            <div class="col-date fw-bold">Date</div>
            <div class="col-remark fw-bold text-center">Remark</div>
            <div class="col-amount fw-bold text-end">Amount</div>
            <!-- <div class="col-action"></div> -->
        </div>

        <!-- List Row -->
        <div id="expense-list" class="expense-list">

           
        </div>
0
    </div>









    <script src="./script.js"></script>
</body>

</html>
